spring.application.name=redis-list-queue
server.address=127.0.0.1
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=10s
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
spring.lifecycle.timeout-per-shutdown-phase=60s
queue.ops.token=${QUEUE_OPS_TOKEN:}
queue.alert.webhook-url=${QUEUE_WEBHOOK_URL:}
queue.maintenance.enabled=true
queue.maintenance.interval-ms=15000
queue.policy.dlq-retention=30d
queue.policy.metadata-retention=90d
queue.policy.expiry-warning=1d
queue.policy.max-attempts=3
queue.policy.stuck-threshold=5m
queue.policy.alert-cooldown=5m
logging.level.root=INFO
logging.level.com.test.redis.demo=INFO
